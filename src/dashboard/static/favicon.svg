<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="df-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9F0A" />
    </linearGradient>
    <linearGradient id="df-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)" />
    </linearGradient>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF9F0A" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0C0E14" stroke="rgba(255, 215, 0, 0.35)" stroke-width="1.8" />
  <!-- Clapperboard Top -->
  <path d="M12 16 L52 16 L50 24 L10 24 Z" fill="url(#df-gold)" filter="url(#glow-gold)" />
  <line x1="20" y1="16" x2="16" y2="24" stroke="#000" stroke-width="2.5" />
  <line x1="32" y1="16" x2="28" y2="24" stroke="#000" stroke-width="2.5" />
  <line x1="44" y1="16" x2="40" y2="24" stroke="#000" stroke-width="2.5" />
  <!-- Lens Rings -->
  <circle cx="32" cy="40" r="14" fill="url(#df-glass)" stroke="rgba(255, 215, 0, 0.6)" stroke-width="1.6" />
  <circle cx="32" cy="40" r="8" fill="#000000" stroke="#FFD700" stroke-width="1.2" />
  <circle cx="32" cy="40" r="3" fill="#FF453A" />
</svg>
